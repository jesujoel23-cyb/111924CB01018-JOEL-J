<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean and simple task manager to plan your day, track progress, and stay productive." />
  <title>To-Do List | Plan • Do • Achieve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-label="To-do list application">
      <header class="app-header">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><path d="M17 8h-4a4 4 0 0 0-4 4v27a4 4 0 0 0 4 4h26a4 4 0 0 0 4-4V12a4 4 0 0 0-4-4h-4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="17" y="4" width="18" height="9" rx="3" stroke="currentColor" stroke-width="3"/><path d="m17 25 5 5 10-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div><h1>To-Do List</h1><p>PLAN <span>•</span> DO <span>•</span> ACHIEVE</p></div>
      </header>

      <form class="task-form" id="taskForm">
        <label class="sr-only" for="taskInput">Enter a new task</label>
        <input id="taskInput" type="text" maxlength="120" placeholder="Enter a new task..." autocomplete="off" />
        <button class="add-btn" type="submit"><span aria-hidden="true">＋</span> Add Task</button>
      </form>

      <div class="toolbar">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All <span id="allCount">0</span></button>
          <button class="filter" data-filter="pending" type="button">Pending <span id="pendingCount">0</span></button>
          <button class="filter" data-filter="completed" type="button">Completed <span id="completedCount">0</span></button>
        </nav>
        <p class="summary"><span id="pendingSummary">0 pending</span><i>·</i><span id="completedSummary">0 completed</span></p>
      </div>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <p class="empty-state" id="emptyState">No tasks here yet. Add one to get started!</p>
      <footer class="app-footer">Small steps make big goals! <span aria-hidden="true">◎</span></footer>
    </section>
    <p class="page-note">Make today count, one task at a time.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
